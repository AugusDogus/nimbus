services:
  nimbus:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random auth secret of at least 32 characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-${BETTER_AUTH_URL:-http://localhost:3000}}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
    volumes:
      - nimbus-data:/data
      - nimbus-config:/config
      # Releases installed from Settings, kept when the container is recreated.
      - nimbus-releases:/var/lib/nimbus
    restart: unless-stopped
    # A stop lets responses finish for NIMBUS_STOP_SECONDS (30), so allow a little longer.
    stop_grace_period: 35s
    # Hands connections that arrive during a restart without downtime to the new server.
    sysctls:
      net.ipv4.tcp_migrate_req: 1

volumes:
  nimbus-data:
  nimbus-config:
  nimbus-releases:
