name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    permissions:
      contents: read
      packages: write
      # Keyless signing of the provenance attestations on published images.
      id-token: write
    # Docker's reusable builder runs each platform on a native runner (ubuntu-26.04 and
    # ubuntu-26.04-arm), pushes by digest, and merges one multi-platform manifest.
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    with:
      output: image
      context: .
      file: ./Dockerfile
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name == 'push' }}
      cache: true
      cache-mode: max
      cache-scope: nimbus
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=pr
        type=edge,branch=main
        type=semver,pattern={{version}}
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
