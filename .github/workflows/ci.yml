name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # Runs every check and the whole publish path on any branch, but publishes only :unverified.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit. Runs for main and tags
# each get a group of their own, so they are never cancelled or queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs, each on a fresh VM. Playwright 1.58 installs browser
# dependencies only for distributions it supports; ubuntu-latest moves to Ubuntu 26.04 in
# November 2026, so every job pins ubuntu-24.04.
jobs:
  static:
    name: format, lint, typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The thumbnail tests decode PDFs and videos with the tools the Docker image ships; without
      # them those tests are skipped.
      - name: Install thumbnail decoders
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      # Ubuntu 24.04 lets AppArmor refuse unprivileged user namespaces, which
      # apps/web/server/nested-mount.test.ts needs to mount a tmpfs and a bind mount inside a
      # data root. Lifting that for this throwaway VM is the least invasive way to run it:
      # running the test file with sudo instead would run it as root, past the permission
      # checks the file layer tests rely on. Elsewhere the test is skipped with this reason.
      - name: Allow unprivileged user namespaces for the nested-mount test
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true
      - run: bun test
        timeout-minutes: 5

  build:
    name: build and budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      # As on a production host (see README, "Restarts without downtime"): connections queued on
      # a server leaving the port move to the next one instead of being reset.
      - run: sudo sysctl -w net.ipv4.tcp_migrate_req=1
      # Hands the port over between real servers under the supervisor while films stream; it
      # needs the built client, so it is skipped in the unit job and runs here.
      - run: bun test apps/web/server/supervisor/handover.e2e.test.ts
        timeout-minutes: 3
      # Updates from the built-in release to a signed bundle it builds itself, and every way an
      # update can fail, each leaving the running server serving.
      - run: bun test apps/web/server/supervisor/updates.e2e.test.ts
        timeout-minutes: 8
      # Public pages must load no module of the signed-in app.
      - run: bun scripts/page-modules.ts
      - run: bun scripts/first-load-js.ts --budget scripts/first-load-js-budget.json

  litmus:
    name: WebDAV conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # With CI=true the conformance server runs the production build.
      - run: bun run build
      - name: Build Litmus 0.18
        run: |
          pkg-config --exists expat || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libexpat1-dev; }
          mkdir -p "$RUNNER_TEMP/litmus" && cd "$RUNNER_TEMP/litmus"
          curl -fsSLo litmus.tar.gz https://notroj.github.io/litmus/litmus-0.18.tar.gz
          echo 'efb3a1b91472760f66f2fcb4ca2b58af19c024fb0263ca725f1f1b44182fd8ca  litmus.tar.gz' | sha256sum -c -
          tar xzf litmus.tar.gz
          cd litmus-0.18
          ./configure --with-included-neon --with-expat --without-ssl --without-gssapi --without-libproxy --without-libntlm
          make -j"$(nproc)"
      - name: WebDAV conformance (Litmus)
        timeout-minutes: 5
        run: bun scripts/webdav-conformance.ts
        env:
          LITMUS_DIR: ${{ runner.temp }}/litmus/litmus-0.18

  # Tests share one server's administrator preferences, sharing settings and trash, so each shard
  # runs one worker against its own server, data and sign-in. Shards run whole spec files,
  # balanced by the durations in scripts/e2e-timings.json; scripts/e2e-shards.ts plans them and
  # fails the shard unless every spec file Playwright discovers is in exactly one shard.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The shard count is the length of this list.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Bun runs the Playwright CLI with the first node on PATH. Playwright 1.58 hangs while
      # extracting browsers under Node 26, so pin an LTS release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # With CI=true the test server runs the production build.
      - run: bun run build
      - run: bun playwright install --with-deps chromium
      # PDF page previews and thumbnails use the decoders the Docker image ships. The step above
      # has just refreshed the package lists.
      - name: Install thumbnail decoders
        run: sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      - name: Select this shard's spec files
        run: bun scripts/e2e-shards.ts select ${{ matrix.shard }}/${{ strategy.job-total }} "$RUNNER_TEMP/e2e-shard.txt"
      - run: bun run test:e2e --test-list "$RUNNER_TEMP/e2e-shard.txt" --reporter=dot,json
        timeout-minutes: 20
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-report.json
          NIMBUS_E2E_SERVER_LOG: ${{ github.workspace }}/e2e-server.log
      # Refresh scripts/e2e-timings.json by hand from these: download the e2e-timings-* artifacts
      # of a run and pass their files to `bun scripts/e2e-shards.ts merge`.
      - name: Summarize spec file durations
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/e2e-report.json" ]; then
            bun scripts/e2e-shards.ts summarize "$RUNNER_TEMP/e2e-report.json" "$RUNNER_TEMP/e2e-timings-${{ matrix.shard }}.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-timings-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            test-results/
            e2e-server.log
          retention-days: 7

  # The one check publication waits for: it passes only when every job above passed, so a failed,
  # cancelled or skipped check keeps the image from getting a deployable tag.
  verify:
    if: ${{ !cancelled() }}
    needs: [static, unit, build, litmus, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$failed" ]; then
            echo "These checks did not pass, so the image is not published:"
            echo "$failed"
            exit 1
          fi

  # The deployable tags and version label for this commit: :edge on main, the version (and
  # :latest) on v* tags, pr-<number> on pull requests, none on manual runs.
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=edge,branch=main
            type=semver,pattern={{version}}

  # Builds while the checks run. Outside pull requests it pushes the image, but only under
  # :unverified (Docker's builder needs some tag for the manifest) and by digest, which no deploy
  # uses; publish below adds the deployable tags once verify passed. :unverified is one fixed tag,
  # so a failed run leaves no new tag, only an untagged image like every superseded :edge does.
  image:
    needs: meta
    permissions:
      contents: read
      packages: write
      # Keyless signing of the provenance attestations on pushed images.
      id-token: write
    # Docker's reusable builder runs each platform on a native runner (ubuntu-26.04 and
    # ubuntu-26.04-arm), pushes by digest, and merges one multi-platform manifest.
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    with:
      output: image
      context: .
      file: ./Dockerfile
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name != 'pull_request' }}
      cache: true
      cache-mode: max
      cache-scope: nimbus
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: type=raw,value=unverified
      set-meta-labels: true
      # The version label the deployable tags would give it, not "unverified".
      meta-labels: org.opencontainers.image.version=${{ needs.meta.outputs.version }}
      # Its build metadata for in-app updates (docs/updates.md): main is the edge channel and
      # v* tags the stable one; other builds get none and look for no update.
      build-args: |
        NIMBUS_REPOSITORY=${{ github.repository }}
        NIMBUS_COMMIT=${{ github.sha }}
        NIMBUS_SEQUENCE=${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.run_number || '' }}
        NIMBUS_CHANNEL=${{ github.ref == 'refs/heads/main' && 'edge' || 'stable' }}
        NIMBUS_IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref == 'refs/heads/main' && 'edge' || 'latest' }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # The only step that makes an image deployable. It needs verify, so it runs only when every
  # check passed for this commit, and it tags the exact manifest the image job pushed, so the
  # digest, labels, provenance and signatures are the ones built. Manual runs re-apply only
  # :unverified, to exercise this path from a branch.
  publish:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [verify, meta, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the verified image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ github.event_name == 'push' && needs.meta.outputs.tags || '' }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          [ -n "$TAGS" ] || TAGS="$repo:unverified"
          source="$repo@$DIGEST"
          # The deploy script requires the revision label to name this commit.
          revisions=$(docker buildx imagetools inspect "$source" --format '{{json .Image}}' \
            | jq -r '[.[].config.Labels["org.opencontainers.image.revision"]] | unique | join(" ")')
          if [ "$revisions" != "$GITHUB_SHA" ]; then
            echo "$source has revision labels '$revisions', not $GITHUB_SHA; nothing was tagged."
            exit 1
          fi
          mapfile -t tags < <(grep -v '^$' <<< "$TAGS")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          # With one source and no annotations this tags the manifest as is, without rewriting it.
          docker buildx imagetools create "${args[@]}" "$source"
          for tag in "${tags[@]}"; do
            actual=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$actual" != "$DIGEST" ]; then
              echo "$tag points at $actual, not the built $DIGEST."
              exit 1
            fi
            echo "$tag -> $DIGEST"
          done

  # The release bundle for in-app updates (docs/updates.md), behind the same gate as the image:
  # built from this commit, signed with the release key, started once as a real server, given a
  # build provenance attestation, and published as the newest release of its channel
  # (channel-edge for main, channel-stable for v* tags), the default update source of the image
  # built from the same commit. The signing key lives in the release-signing environment, which
  # only this job may use; restrict that environment to main and v* tags in the repository's
  # settings. Without a key the job builds and tests the bundle but publishes nothing.
  bundle:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-signing
    concurrency:
      group: bundle-${{ github.ref == 'refs/heads/main' && 'edge' || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CHANNEL: ${{ github.ref == 'refs/heads/main' && 'edge' || 'stable' }}
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref == 'refs/heads/main' && 'edge' || 'latest' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The commits since the channel's previous build become the bundle's notes.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Find the channel's previous build
        id: previous
        run: |
          commit=$(gh release download "channel-$CHANNEL" --pattern manifest.json --output - 2>/dev/null | jq -r '.build.commit // empty' || true)
          if [ -n "$commit" ] && git cat-file -e "$commit^{commit}" 2>/dev/null; then
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and sign the bundle
        env:
          NIMBUS_RELEASE_SIGNING_KEY: ${{ secrets.NIMBUS_RELEASE_SIGNING_KEY }}
          KEY_ID: ${{ vars.NIMBUS_RELEASE_KEY_ID }}
          PREVIOUS: ${{ steps.previous.outputs.commit }}
        run: |
          args=(--out bundle --sequence "$GITHUB_RUN_NUMBER" --channel "$CHANNEL" --repository "$GITHUB_REPOSITORY" --image "$IMAGE")
          [ -z "$PREVIOUS" ] || args+=(--previous-commit "$PREVIOUS")
          if [ -n "$NIMBUS_RELEASE_SIGNING_KEY" ] && [ -n "$KEY_ID" ]; then args+=(--key-id "$KEY_ID"); fi
          bun scripts/release-bundle.ts "${args[@]}"
      - name: Start the bundle as a server
        run: bun scripts/release-smoke.ts bundle
      - name: Attest the bundle's provenance
        if: ${{ hashFiles('bundle/manifest.sig') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bundle/*.tar.gz
      # The bundle first, its signature next and the manifest last, so a manifest is never
      # published before what it names. A check between two uploads can still see a new
      # signature beside the old manifest; it fails and the next check succeeds.
      - name: Publish as the channel's newest release
        if: ${{ hashFiles('bundle/manifest.sig') != '' }}
        run: |
          release="channel-$CHANNEL"
          gh release view "$release" >/dev/null 2>&1 \
            || gh release create "$release" --prerelease --title "Nimbus $CHANNEL channel" \
                 --notes "The newest signed release bundle of the $CHANNEL channel, which Nimbus installs from Settings. Replaced by every build."
          file=$(jq -r .bundle.file bundle/manifest.json)
          gh release upload "$release" "bundle/$file" --clobber
          gh release upload "$release" bundle/manifest.sig --clobber
          gh release upload "$release" bundle/manifest.json --clobber
          # Keep the three newest bundles beside it; installations fetch only the newest.
          gh release view "$release" --json assets --jq '.assets[].name' \
            | grep -E '^nimbus-.*\.tar\.gz$' | sort -t- -k3 -n | head -n -3 \
            | while read -r old; do gh release delete-asset "$release" "$old" --yes; done
