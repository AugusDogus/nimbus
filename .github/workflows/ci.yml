name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    # Playwright 1.58 installs browser dependencies only for distributions it supports;
    # ubuntu-latest moves to Ubuntu 26.04 in November 2026.
    runs-on: ubuntu-24.04
    # The production Playwright suite alone takes 6 to 14 minutes on a fast machine, plus about
    # 10 minutes of installs, builds, unit tests and Litmus; runners have fewer cores.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Bun runs the Playwright CLI with the first node on PATH. Playwright 1.58 hangs while
      # extracting browsers under Node 26, so pin an LTS release.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # The thumbnail tests decode PDFs and videos with the tools the Docker image ships; without
      # them those tests are skipped.
      - name: Install thumbnail decoders
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
      # Ubuntu 24.04 lets AppArmor refuse unprivileged user namespaces, which
      # apps/web/server/nested-mount.test.ts needs to mount a tmpfs and a bind mount inside a
      # data root. Lifting that for this throwaway VM is the least invasive way to run it:
      # running the test file with sudo instead would run it as root, past the permission
      # checks the file layer tests rely on. Elsewhere the test is skipped with this reason.
      - name: Allow unprivileged user namespaces for the nested-mount test
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --mount true
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
        timeout-minutes: 5
      - run: bun run build
      # Public pages must load no module of the signed-in app.
      - run: bun scripts/page-modules.ts
      - run: bun scripts/first-load-js.ts --budget scripts/first-load-js-budget.json
      - name: Build Litmus 0.18
        run: |
          pkg-config --exists expat || { sudo apt-get update && sudo apt-get install -y --no-install-recommends libexpat1-dev; }
          mkdir -p "$RUNNER_TEMP/litmus" && cd "$RUNNER_TEMP/litmus"
          curl -fsSLo litmus.tar.gz https://notroj.github.io/litmus/litmus-0.18.tar.gz
          echo 'efb3a1b91472760f66f2fcb4ca2b58af19c024fb0263ca725f1f1b44182fd8ca  litmus.tar.gz' | sha256sum -c -
          tar xzf litmus.tar.gz
          cd litmus-0.18
          ./configure --with-included-neon --with-expat --without-ssl --without-gssapi --without-libproxy --without-libntlm
          make -j"$(nproc)"
      - name: WebDAV conformance (Litmus)
        timeout-minutes: 5
        run: bun scripts/webdav-conformance.ts
        env:
          LITMUS_DIR: ${{ runner.temp }}/litmus/litmus-0.18
      - run: bun playwright install --with-deps chromium
      - run: bun run test:e2e
        timeout-minutes: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Images are built and published only after every check above passes for the same commit.
  image:
    needs: verify
    concurrency:
      group: docker-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
      # Keyless signing of the provenance attestations on published images.
      id-token: write
    # Docker's reusable builder runs each platform on a native runner (ubuntu-26.04 and
    # ubuntu-26.04-arm), pushes by digest, and merges one multi-platform manifest.
    uses: docker/github-builder/.github/workflows/build.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    with:
      output: image
      context: .
      file: ./Dockerfile
      platforms: linux/amd64,linux/arm64
      push: ${{ github.event_name == 'push' }}
      cache: true
      cache-mode: max
      cache-scope: nimbus
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=pr
        type=edge,branch=main
        type=semver,pattern={{version}}
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
