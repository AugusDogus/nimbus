openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Nimbus library API
  version: 1.0.0
  summary: Read-only access to one library for a paired device
  description: >-
    A library is a named set of folders that a Nimbus account offers, read-only, to the devices it
    pairs. A device pairs by showing a code that the account's owner approves on a signed-in phone
    or browser, and then holds one opaque bearer token bound to that one library. See README.md.
    Every response is JSON unless stated otherwise and carries Cache-Control private, no-store,
    except where a response says private, no-cache. Request bodies are JSON, at most 4 KiB, and
    unknown fields are refused.
servers:
  - url: https://nimbus.example.test/api/library/v1
    description: An invented server. Use your Nimbus server's public HTTPS address.
security:
  - DeviceBearer: []
paths:
  /pair/start:
    post:
      operationId: startPairing
      summary: Start pairing a device
      description: >-
        Needs no sign-in and grants nothing by itself. Show `pairingCode` (and optionally a QR code
        of `verificationUrlComplete`) to the person, then poll with `deviceCode`, which is secret.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairStartRequest"
      responses:
        "200":
          description: A pairing request, valid for `expiresIn` seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairStartResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"
  /pair/poll:
    post:
      operationId: pollPairing
      summary: Ask how a pairing request stands
      description: >-
        Poll no more often than `interval` seconds. An early poll is answered with 429 `slow_down`
        and a larger `interval`, which applies to every later poll. The token is returned exactly
        once; if that response is lost, start pairing again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairPollRequest"
      responses:
        "200":
          description: The request's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairPollResponse"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me:
    get:
      operationId: getMe
      summary: This device and its library
      responses:
        "200":
          description: The paired device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"
  /library:
    get:
      operationId: getLibrary
      summary: Every file in the library, newest first
      description: >-
        One complete flat list of the regular files under the library's folders, ordered by
        `addedAt` descending, then `id` ascending. Hidden files and folders, files more than 32 folders deep, and the library data
        file are not listed. A chosen folder that is missing contributes nothing, so the list may
        be empty. Private, no-cache: revalidate with If-None-Match.
      parameters:
        - name: kinds
          in: query
          required: false
          description: Comma-separated kinds to list, such as `video,document`. All kinds when absent.
          schema:
            type: string
            pattern: ^(video|audio|image|document|other)(,(video|audio|image|document|other))*$
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The library.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"
  /items/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItem
      summary: One item, as the library lists it
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /items/{id}/file:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItemFile
      summary: The file's bytes
      description: >-
        Inline, with the item's content type, `Content-Length`, `Accept-Ranges: bytes`, the item's
        version as a quoted `ETag`, and `Cache-Control: private, no-cache`. One byte range per
        request, including open-ended and suffix ranges; `If-Range` and `HEAD` are supported.
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfRange"
      responses:
        "200":
          description: The whole file.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "429":
          $ref: "#/components/responses/RateLimited"
    head:
      operationId: headItemFile
      summary: The file's headers
      responses:
        "200":
          description: The headers a GET would answer with, without the body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
  /items/{id}/poster:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: w
        in: query
        required: false
        description: >-
          The poster's width: 400, 800 or 1920 pixels. Any other number rounds to the nearest of
          those (halfway rounds up); without it, 800.
        schema:
          type: integer
          minimum: 0
    get:
      operationId: getItemPoster
      summary: The item's poster, as a JPEG
      description: >-
        A frame a few seconds into a video, the first page of a PDF, or a scaled copy of an
        image, in its own shape. At most `w` pixels wide, never larger than its source; a page
        is drawn at `w`. `Content-Length` is exact; the `ETag` changes with the item's version
        and the width. Private, no-cache: revalidate with If-None-Match. The first request for
        an item may take a moment while it is drawn; later ones are served from a cache.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The poster.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: "`item_not_found`, or `poster_not_available` for an item that has no poster."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`poster_failed`: this version of the file could not be drawn. It is tried again once the file changes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"
    head:
      operationId: headItemPoster
      summary: The poster's headers
      responses:
        "200":
          description: The headers a GET would answer with, without the body.
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /items/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: createMediaAddress
      summary: A media address and its cookie, for clients that cannot send the token
      description: >-
        For media players that cannot add an Authorization header to their requests. The
        response sets a cookie (`Set-Cookie`) the client must send with every request for the
        address. See README.md, Media addresses.
      responses:
        "200":
          description: The address and when it expires.
          headers:
            Set-Cookie:
              description: >-
                `__Secure-nimbus-media-<session>=<secret>; Path=/api/library/v1/media; Max-Age=<at
                most the address's lifetime>; HttpOnly; SameSite=Strict; Secure`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /media/{id}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: ticket
        in: query
        required: true
        description: The ticket from the media address. Never send it anywhere else.
        schema:
          type: string
    get:
      operationId: getMedia
      summary: The file's bytes for a media address
      description: >-
        Needs the address's ticket and its cookie, not the token. Every request is checked again.
        A ranged request is answered in full, with an exact `Content-Range` and `Content-Length`;
        once under way it cannot be stopped, and changes take effect on the next request. A
        request without a range gets the whole file, sent in chunks that stop when its access ends.
      security:
        - MediaCookie: []
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfRange"
      responses:
        "200":
          description: The whole file.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          $ref: "#/components/responses/PartialContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`stream_invalid` or `stream_expired`: mint a new address."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: "`stream_source_changed`: the file changed since the address was made; mint a new one."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          $ref: "#/components/responses/RangeNotSatisfiable"
        "429":
          $ref: "#/components/responses/RateLimited"
    head:
      operationId: headMedia
      summary: The headers of a media address
      security:
        - MediaCookie: []
      responses:
        "200":
          description: The headers a GET would answer with, without the body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque Nimbus device token (nimbus_device_ prefix)
      description: >-
        The token `/pair/poll` returned. Checked against the server on every request. It stays
        valid until revoked or unused for 30 days; each successful request slides that deadline.
    MediaCookie:
      type: apiKey
      in: cookie
      name: __Secure-nimbus-media-<session>
      description: >-
        The cookie `POST /items/{id}/stream` sets, sent with the address it came with. Useless
        without that address's ticket, and the ticket is useless without it.
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^itm_[A-Za-z0-9_-]{10,64}$
    Range:
      name: Range
      in: header
      required: false
      description: One byte range, such as `bytes=0-1`, `bytes=1000-` or `bytes=-500`.
      schema:
        type: string
    IfRange:
      name: If-Range
      in: header
      required: false
      description: The ETag the client has; a range is served only while it still matches.
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
  headers:
    ETag:
      description: Opaque validator of this representation.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait.
      schema:
        type: string
        pattern: ^[0-9]+$
  responses:
    PartialContent:
      description: One byte range, with an exact `Content-Range` and `Content-Length`.
      headers:
        Content-Range:
          schema:
            type: string
            pattern: ^bytes [0-9]+-[0-9]+/[0-9]+$
      content:
        "*/*":
          schema:
            type: string
            format: binary
    RangeNotSatisfiable:
      description: The range starts past the end. `Content-Range` gives the size, as `bytes */<size>`.
    Error:
      description: A failure with a stable code.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >-
        `authorization_required` (no token sent), `token_invalid` (not a token this server knows)
        or `token_revoked` (revoked, unused for 30 days, or its account or library is gone). Pair
        again in every case.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: "`rate_limited`, or `slow_down` for an early poll."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotModified:
      description: Unchanged since the ETag sent. The request was authorized first.
  schemas:
    PairStartRequest:
      type: object
      additionalProperties: false
      required: [deviceName]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
          description: >-
            Shown to the person approving, labeled as supplied by the device. No control,
            invisible formatting (such as bidirectional marks) or line break characters.
          examples: [Kitchen tablet]
    PairStartResponse:
      type: object
      additionalProperties: false
      required:
        [
          deviceCode,
          pairingCode,
          verificationUrl,
          verificationUrlComplete,
          expiresIn,
          interval,
        ]
      properties:
        deviceCode:
          type: string
          minLength: 32
          maxLength: 191
          description: Secret. Never show, log or encode it in a QR code.
        pairingCode:
          type: string
          pattern: ^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{4}-[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{4}$
          examples: [B7KD-M4Q9]
        verificationUrl:
          type: string
          format: uri
          examples: [https://nimbus.example.test/pair]
        verificationUrlComplete:
          type: string
          format: uri
          description: The pairing page with the code filled in, for a QR code. Opening it approves nothing.
          examples: [https://nimbus.example.test/pair?code=B7KD-M4Q9]
        expiresIn:
          type: integer
          const: 600
        interval:
          type: integer
          const: 5
    PairPollRequest:
      type: object
      additionalProperties: false
      required: [deviceCode]
      properties:
        deviceCode:
          type: string
          minLength: 1
          maxLength: 191
    PairPollResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: pending
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: denied
        - type: object
          additionalProperties: false
          required: [status]
          description: Also the answer for an unknown or already collected code.
          properties:
            status:
              const: expired
        - type: object
          additionalProperties: false
          required: [status, token, library]
          properties:
            status:
              const: approved
            token:
              type: string
              minLength: 20
              description: The device's bearer token, returned only this once.
            library:
              $ref: "#/components/schemas/LibrarySummary"
    LibrarySummary:
      type: object
      additionalProperties: false
      required: [id, title]
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{5,100}$
        title:
          type: string
          minLength: 1
          maxLength: 120
    Me:
      type: object
      additionalProperties: false
      required: [deviceName, library]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
        library:
          $ref: "#/components/schemas/LibrarySummary"
    LibraryResponse:
      type: object
      additionalProperties: false
      required: [library, items, generatedAt]
      properties:
        library:
          $ref: "#/components/schemas/LibrarySummary"
        items:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/Item"
        generatedAt:
          type: string
          format: date-time
          description: When this library's contents or settings last changed.
    Item:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          kind,
          contentType,
          folder,
          path,
          addedAt,
          sizeBytes,
          version,
          poster,
        ]
      properties:
        id:
          type: string
          pattern: ^itm_[A-Za-z0-9_-]{10,64}$
          description: >-
            Opaque and random. Kept through renames and moves made through Nimbus and when a file
            returns to its path; a rename made outside Nimbus gives a new id. See README.md.
        name:
          type: string
          minLength: 1
          description: The file's name, extension included.
        kind:
          type: string
          enum: [video, audio, image, document, other]
        contentType:
          type: string
          minLength: 1
          examples: [video/mp4, application/pdf]
        folder:
          type: integer
          minimum: 0
          description: >-
            Which of the library's folders holds the file, as an index: 0 for the first, in the
            owner's order, counting only the folders the device sees now.
        path:
          type: string
          minLength: 1
          description: >-
            The file's path below that folder, its real names joined with `/` and no leading
            slash, such as `Guides/Trail map.pdf`, or just its name at the top of the folder.
        addedAt:
          type: string
          format: date-time
          description: >-
            When the file joined the library: its modification time for files found when a folder
            is first scanned, otherwise when the library first saw it. Never changes afterwards.
        sizeBytes:
          type: integer
          minimum: 0
        version:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,128}$
          description: Opaque; changes whenever the file's content may have changed.
        poster:
          oneOf:
            - $ref: "#/components/schemas/Poster"
            - type: "null"
          description: >-
            The item's poster, or null when it has none: its kind has no poster (audio, other,
            documents that are not PDFs), the server cannot draw it, or this version of the file
            could not be drawn.
    Poster:
      type: object
      additionalProperties: false
      required: [url, width, height]
      properties:
        url:
          type: string
          pattern: ^/api/library/v1/items/itm_[A-Za-z0-9_-]{10,64}/poster$
          description: The poster endpoint's path on this server. Add `?w=400`, `?w=800` or `?w=1920`.
        width:
          type: [integer, "null"]
          minimum: 1
          description: >-
            The source's width in pixels (a video frame's display size, an image's size once its
            orientation applies, a page's size in points), for laying out before the poster loads.
            Null until the item's first poster has been drawn; ask for one to learn it.
        height:
          type: [integer, "null"]
          minimum: 1
          description: The source's height, as `width`. Null exactly when `width` is.
    MediaAddress:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url:
          type: string
          format: uri
          description: "`<server>/api/library/v1/media/{id}?ticket=...`, on this server."
        expiresAt:
          type: string
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - authorization_required
                - token_invalid
                - token_revoked
                - forbidden_origin
                - not_found
                - item_not_found
                - poster_not_available
                - method_not_allowed
                - stream_invalid
                - stream_expired
                - stream_source_changed
                - library_too_large
                - poster_failed
                - rate_limited
                - slow_down
                - library_unavailable
                - service_unavailable
            message:
              type: string
              minLength: 1
              description: For people. Never contains paths or credentials.
        interval:
          type: integer
          minimum: 5
          description: Only with `slow_down`; the least poll interval from now on.
